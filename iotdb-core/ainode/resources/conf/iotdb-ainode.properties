# Used for indicate cluster name and distinguish different cluster.
# Datatype: string
cluster_name=defaultCluster

# ConfigNode address registered at AINode startup.
# Allow modifications only before starting the service for the first time.
# Datatype: String
ain_seed_config_node=127.0.0.1:10710

# Used for connection of DataNode/ConfigNode clients
# Could set 127.0.0.1(for local test) or ipv4 address
# Datatype: String
ain_rpc_address=127.0.0.1

# Used for connection of DataNode/ConfigNode clients
# Bind with MN_RPC_ADDRESS
# Datatype: String
ain_rpc_port=10810

# The DataNode address for fetching IoTDB data
# Datatype: String
ain_cluster_ingress_address=127.0.0.1

# The DataNode port for fetching IoTDB data
# Datatype: Integer
ain_cluster_ingress_port=6667

# The username of IoTDB cluster.
# Datatype: String
ain_cluster_ingress_username=root

# The password of IoTDB cluster.
# Datatype: String
ain_cluster_ingress_password=root

# ==================== Inference (operational knobs) ====================
# Most inference tuning is auto-derived at startup from hardware.
# Operators typically only need the three settings below.

# Fraction of device memory reserved for inference pools.
# Omit to auto-detect by device: GPU 8G->0.45, 16G->0.50, 24G+->0.55; CPU->0.25.
# Recommended starting points:
#   8 GB GPU  -> 0.45
#   16 GB GPU -> 0.50
#   24 GB GPU -> 0.55
#   CPU-only  -> 0.25
# Datatype: Float
# ain_inference_memory_usage_ratio=0.6

# Scheduling profile for dynamic batching (maps to internal window/deadline/interval).
#   latency    - poll 5ms,  wait window 5ms,  deadline 200ms
#   balanced   - poll 15ms, wait window 15ms, deadline 500ms
#   throughput - poll 30ms, wait window 40ms, deadline 1500ms
# Internal length buckets default to input=32 / output=16 for all profiles.
# Datatype: String
# ain_inference_scheduling_profile=balanced

# Optional cap on requests per inference batch. Omit to auto-tune from memory.
# Typical auto values: 8 GB GPU->16, 16 GB GPU->32, 24 GB GPU->48, CPU->4~16.
# Datatype: Integer
# ain_inference_max_batch_size=32

# Interval for logging pool inference statistics (seconds)
# Datatype: Integer
# ain_inference_stats_log_interval_in_sec=60

# Max waiting requests per inference pool before fast reject (vLLM-style admission).
# Omit to auto-tune as max(64, max_batch_size * 8).
# Datatype: Integer
# ain_inference_max_queue_size=256

# ==================== Inference (advanced / deprecated) ====================
# Direct overrides below remain supported for backward compatibility.
# Prefer ain_inference_scheduling_profile and hardware auto-tuning instead.

# How often the pool polls waiting/running queues (batch_interval_ms, milliseconds)
# Datatype: Integer
# ain_inference_batch_interval_in_ms=15

# Minimum waiting window before forming a partial batch (batch_waiting_window_ms)
# Datatype: Integer
# ain_inference_batch_waiting_window_in_ms=15

# Maximum time a request may wait before forced dispatch (batch_deadline_ms)
# Datatype: Integer
# ain_inference_batch_deadline_in_ms=500

# Maximum total points (batch_size * target_count * input_length) per batch
# Datatype: Integer
# ain_inference_max_batch_points=65536

# Input/output length bucket sizes used to merge similar-shape requests
# Datatype: Integer
# ain_inference_input_length_bucket_size=32
# ain_inference_output_length_bucket_size=16

# Minimum free memory required before scheduler dispatches more work (bytes)
# Datatype: Integer
# ain_inference_max_memory_bytes=1073741824

# Maximum requests activated or stepped per scheduler cycle
# Datatype: Integer
# ain_inference_max_activate_size=64
# ain_inference_max_step_size=64

# Overhead ratio when estimating inference pool count from model footprint
# Datatype: Float
# ain_inference_extra_memory_ratio=1.2

# Per-model memory footprint map used for pool sizing (bytes)
# Datatype: String (Python dict literal)
# ain_inference_model_mem_usage_map={"sundial":1086324736,"timer_xl":897581056,"chronos2":1258291200}

# The AINode metadata storage path.
# The starting directory of the relative path is related to the operating system.
# It is recommended to use an absolute path.
# Datatype: String
# ain_system_dir=data/ainode/system

# The path where AINode stores model files
# The starting directory of the relative path is related to the operating system.
# It is recommended to use an absolute path.
# Datatype: String
# ain_models_dir=data/ainode/models

# The path where AINode stores logs
# The starting directory of the relative path is related to the operating system.
# It is recommended to use an absolute path.
# Datatype: String
# ain_logs_dir=logs

# Whether to use compression in Thrift
# Please use 0 or 1
# Datatype: Boolean
# ain_thrift_compression_enabled=0

# Whether to use ssl for fetching IoTDB data
# Use the same value as enable_thrift_ssl in iotdb-system.properties
# Please use 0 or 1
# Datatype: Boolean
# ain_cluster_ingress_ssl_enabled=0

# The AINode SSL certificate file path.
# The starting directory of the relative path is related to the operating system.
# It is recommended to use an absolute path.
# Datatype: String
# ain_thrift_ssl_cert_file=

# The AINode SSL private key file path.
# The starting directory of the relative path is related to the operating system.
# It is recommended to use an absolute path.
# Datatype: String
# ain_thrift_ssl_key_file=
